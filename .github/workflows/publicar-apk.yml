name: Publicar APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Prepara o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Grava a configuração de compilação
        env:
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$WORKOS_CLIENT_ID" ] || [ -z "$API_BASE_URL" ]; then
            echo "Defina os secrets WORKOS_CLIENT_ID e API_BASE_URL."
            exit 1
          fi
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "API_BASE_URL precisa começar com http:// ou https://."
              exit 1
              ;;
          esac
          case "$API_BASE_URL" in
            *127.0.0.1*|*localhost*|*10.0.2.2*)
              echo "API_BASE_URL de release não pode ser o endereço local do emulador."
              exit 1
              ;;
          esac
          redirect="${WORKOS_REDIRECT_URI:-br.com.implateflow://auth/callback}"
          jq -n \
            --arg client "$WORKOS_CLIENT_ID" \
            --arg redirect "$redirect" \
            --arg api "$API_BASE_URL" \
            '{WORKOS_CLIENT_ID:$client, WORKOS_REDIRECT_URI:$redirect, API_BASE_URL:$api}' \
            > config/local.json

      - name: Prepara a assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Defina ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Compila o APK
        run: flutter build apk --release --dart-define-from-file=config/local.json

      - name: Publica a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          safe="${version//+/-}"
          package="implate-flow-${safe}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$package"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="apk-${safe}-${{ github.run_number }}"
          fi
          gh release create "$tag" "$package" \
            --title "Implate Flow ${version}" \
            --notes "APK para instalação direta. A URL da API e o WorkOS vieram dos secrets desta compilação. Atualizações seguintes precisam do mesmo keystore."
